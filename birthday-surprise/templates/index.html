<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <!-- ============================================================
     ✏️  EDIT THESE THREE LINES to personalize the surprise
     ============================================================ -->
  <div id="config" data-friend-name="Pajju" data-your-name="Likitha" data-letter="Don't know how to express my feeling towards u...Innu parichaya agi swalpa dinadalle i got too attcahed to you
     ....The moments or the time we spent together.....Naan helid ella nu keluskotyaaaa, without judging, support swalpa swalpa madtyaa biduu...
     Hope so let this bond continue forever ..yaar drushti nu bbilde irli....Thank you for everything....Let all your draems true...
     Many more happy returns of the day Pajju....lots of love.......">
  </div>

  <!-- floating hearts / petals background layer -->
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <!-- ============ HERO ============ -->
  <section class="hero" id="hero">
    <div class="hero-glow"></div>
    <p class="hero-eyebrow">a little something for</p>
    <h1 class="hero-title">
      Happy Birthday,<br><span id="friend-name-hero">Friend</span>
    </h1>
    <p class="hero-sub">A small surprise, made with a lot of love.</p>
    <button class="scroll-cue" id="scroll-cue" aria-label="Scroll down to open your surprise">
      <span>open your surprise</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 4v15m0 0l-6-6m6 6l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </section>

  <!-- ============ GIFT / PHOTO REVEAL ============ -->
  <section class="section gift-section" id="gift-section">
    <h2 class="section-title">tap the gift</h2>
    <p class="section-hint">there's a memory waiting inside</p>

    <div class="gift-wrap">
      <button class="gift-box" id="gift-box" aria-label="Open your gift">
        <span class="gift-lid"></span>
        <span class="gift-lid-ribbon"></span>
        <span class="gift-base"></span>
        <span class="gift-ribbon-v"></span>
        <span class="gift-bow">
          <span class="bow-loop bow-loop-l"></span>
          <span class="bow-loop bow-loop-r"></span>
          <span class="bow-knot"></span>
        </span>
      </button>

      <div class="polaroid" id="polaroid">
        <div class="polaroid-photo">
          <img src="{{ url_for('static', filename='images/photo.jpg') }}" alt="A favourite memory together">
        </div>
        <p class="polaroid-caption">a moment worth freezing 🤍</p>
      </div>
    </div>
  </section>

  <!-- ============ ENVELOPE ============ -->
  <section class="section envelope-section" id="envelope-section">
    <h2 class="section-title">a letter for you</h2>
    <p class="section-hint">click the envelope to open it</p>

    <div class="envelope" id="envelope">
      <div class="envelope-back"></div>
      <div class="letter" id="letter">
        <p class="letter-greeting">Dear <span id="friend-name-letter">Friend</span>,</p>
        <p class="letter-body" id="letter-body"></p>
        <p class="letter-sign">With love,<br><span id="your-name-sign">Me</span></p>
      </div>
      <div class="envelope-flap"></div>
      <div class="envelope-front"></div>
      <div class="envelope-seal">♥</div>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <button class="confetti-btn" id="confetti-btn">celebrate again 🎉</button>
    <p class="footer-note">made with ♥ for a very special birthday</p>
  </footer>

  <canvas id="confetti-canvas"></canvas>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
